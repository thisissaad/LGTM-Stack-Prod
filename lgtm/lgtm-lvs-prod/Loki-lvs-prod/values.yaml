# logging/loki/values.yaml — Production hardened
# 30-day retention
# Mode: Distributed (microservices)

loki:
  deploymentMode: Distributed

  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 3

    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    storage:
      type: s3
      bucketNames:
        chunks: zks-paas-observability-lgtm-prod-lvs-loki
        ruler: zks-paas-observability-lgtm-prod-lvs-loki
        admin: zks-paas-observability-lgtm-prod-lvs-loki
      s3:
        endpoint: http://ceph-controller-02-lsv.rfiserve.net
        region: us-east-1
        s3ForcePathStyle: true

    limits_config:
      # Retention
      retention_period: 720h               # 30 days
      max_query_lookback: 720h

      # Query limits — tuned for 3-4TB/month
      query_timeout: 180s
      max_query_series: 2000
      max_query_parallelism: 64            
      split_queries_by_interval: 1h        # split large queries into 1h chunks
      max_entries_limit_per_query: 5000
      max_cache_freshness_per_query: 10m

      # Ingestion limits — ~50MB/s peak for 3-4TB/month
      ingestion_rate_mb: 50
      ingestion_burst_size_mb: 100
      per_stream_rate_limit: 5MB
      per_stream_rate_limit_burst: 20MB

      # Sample rejection
      reject_old_samples: true
      reject_old_samples_max_age: 168h     # 7-day backfill window

      # Cardinality protection — critical at TB scale
      max_streams_per_user: 0              # 0 = use global default
      max_global_streams_per_user: 10000   # prevent label explosion
      max_label_names_per_series: 30
      max_label_value_length: 4096

      # Volume API for Explore Logs
      volume_enabled: true

    structuredConfig:
      ingester:
        wal:
          flush_on_shutdown: true          # safe shutdown, flush WAL before exit
        # Chunk tuning for TB-scale — larger chunks = fewer S3 objects
        chunk_idle_period: 30m            # flush if stream idle for 30m
        chunk_target_size: 1572864        # target 1.5MB chunks (default 1MB)
        max_chunk_age: 2h                 # force flush after 2h regardless

      compactor:
        working_directory: /var/loki/compactor
        delete_request_store: s3
        retention_enabled: true
        compaction_interval: 10m
        retention_delete_delay: 2h
        retention_delete_worker_count: 150 
        delete_request_cancel_period: 24h

      querier:
        max_concurrent: 16               # per-querier concurrency

      query_scheduler:
        max_outstanding_requests_per_tenant: 2048  

      frontend:
        max_outstanding_per_tenant: 2048
        compress_responses: true         # gzip query responses

      storage_config:
        aws:
          endpoint: http://ceph-controller-02-lsv.rfiserve.net
          region: us-east-1
          s3forcepathstyle: true
          http_config:
            insecure_skip_verify: true
        tsdb_shipper:
          index_gateway_client:
            server_address: dns+lgtm-prod-lvs-loki-index-gateway-headless.lgtm-lvs-prod.svc.cluster.local:9095
        boltdb_shipper:
          index_gateway_client:
            server_address: dns+lgtm-prod-lvs-loki-index-gateway-headless.lgtm-lvs-prod.svc.cluster.local:9095
        hedging:
          at: 250ms
          max_per_second: 20
          up_to: 3

      ruler:
        storage:
          type: s3
          s3:
            endpoint: http://ceph-controller-02-lsv.rfiserve.net
            region: us-east-1
            bucketnames: zks-paas-observability-lgtm-prod-lvs-loki
            s3forcepathstyle: true
            http_config:
              insecure_skip_verify: true
      query_range:
        cache_results: true
        align_queries_with_step: true
        cache_index_stats_results: true          
        cache_volume_results: true               
        cache_series_results: true 
        results_cache:
          cache:
            memcached_client:
              addresses: dnssrvnoa+_memcache._tcp.lgtm-prod-lvs-memecached-loki-memcached-results.lgtm-lvs-prod.svc.cluster.local
              timeout: 500ms
              max_idle_conns: 16
              update_interval: 1m
              consistent_hash: true

      chunk_store_config:
        chunk_cache_config:
          memcached_client:
            addresses: dnssrvnoa+_memcache._tcp.lgtm-prod-lvs-memecached-loki-memcached-chunks.lgtm-lvs-prod.svc.cluster.local
            timeout: 500ms
            max_idle_conns: 16
            update_interval: 1m
            consistent_hash: true
  # Caching disabled (no memcached deployed)
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

  # ============================================================
  # INGESTER — StatefulSet, HPA not supported 
  # ============================================================
  ingester:
    podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3100"
    replicas: 3
    zoneAwareReplication:
      enabled: false
    # PodDisruptionBudget 
    maxUnavailable: 1                      
    extraEnv:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: loki-lvs-prod-s3
            key: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: loki-lvs-prod-s3
            key: AWS_SECRET_ACCESS_KEY
    persistence:
      size: 20Gi                          
      storageClass: block-pure-c50-101-az-a
    resources:
      requests:
        cpu: 500m
        memory: 3Gi                       
      limits:
        cpu: 3000m
        memory: 5Gi
    # Spread ingesters across nodes for HA
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/component: ingester
            topologyKey: kubernetes.io/hostname

  # ============================================================
  # DISTRIBUTOR — Deployment, HPA enabled (CPU-based)
  # Scales with write throughput — first component hit by Alloy
  # ============================================================
  distributor:
    podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3100"
    replicas: 2
    maxUnavailable: 1
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 80   
      targetMemoryUtilizationPercentage: 80
    extraEnv:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: loki-lvs-prod-s3
            key: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: loki-lvs-prod-s3
            key: AWS_SECRET_ACCESS_KEY
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 1Gi
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/component: distributor
              topologyKey: kubernetes.io/hostname

  # ============================================================
  # QUERIER — Deployment, HPA enabled (CPU + memory)
  # Scales with read/query load — does the heavy S3 fetching
  # ============================================================
  querier:
    podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3100"
    replicas: 2
    maxUnavailable: 1
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6                      
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 75
    extraEnv:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: loki-lvs-prod-s3
            key: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: loki-lvs-prod-s3
            key: AWS_SECRET_ACCESS_KEY
    resources:
      requests:
        cpu: 500m
        memory: 1Gi                        
      limits:
        cpu: 2000m
        memory: 6Gi
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/component: querier
              topologyKey: kubernetes.io/hostname

  # ============================================================
  # QUERY FRONTEND — Deployment, HPA enabled (CPU-based)
  # Lightweight — splits queries, caches results, minimal resources
  # ============================================================
  queryFrontend:
    podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3100"
    replicas: 2
    maxUnavailable: 1
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
    extraEnv:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: loki-lvs-prod-s3
            key: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: loki-lvs-prod-s3
            key: AWS_SECRET_ACCESS_KEY
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1500m
        memory: 2Gi

  # ============================================================
  # QUERY SCHEDULER — Deployment, fixed replicas
  # Keep at 2 for HA 
  # ============================================================
  queryScheduler:
    podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3100"
    replicas: 2
    extraEnv:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: loki-lvs-prod-s3
            key: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: loki-lvs-prod-s3
            key: AWS_SECRET_ACCESS_KEY
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # ============================================================
  # INDEX GATEWAY — StatefulSet, fixed replicas
  # Caches TSDB index — HPA not appropriate (stateful, index cache)
  # ============================================================
  indexGateway:
    podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3100"
    replicas: 2
    maxUnavailable: 1
    extraEnv:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: loki-lvs-prod-s3
            key: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: loki-lvs-prod-s3
            key: AWS_SECRET_ACCESS_KEY
    persistence:
      size: 20Gi                           
      storageClass: block-pure-c50-101-az-a
    resources:
      requests:
        cpu: 350m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/component: index-gateway
            topologyKey: kubernetes.io/hostname

  # ============================================================
  # COMPACTOR — StatefulSet, always singleton (replicas: 1)
  # Never scale > 1 — two compactors = index corruption
  # ============================================================
  compactor:
    podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3100"
    replicas: 1
    extraEnv:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: loki-lvs-prod-s3
            key: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: loki-lvs-prod-s3
            key: AWS_SECRET_ACCESS_KEY
    persistence:
      size: 20Gi                           # working dir grows with 30d retention
      storageClass: block-pure-c50-101-az-a
    resources:
      requests:
        cpu: 300m
        memory: 256Mi
      limits:
        cpu: 1000m                         # compaction is CPU-intensive
        memory: 2Gi

  # ============================================================
  # RULER — StatefulSet, fixed replicas
  # ============================================================
  ruler:
    replicas: 1
    extraEnv:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: loki-lvs-prod-s3
            key: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: loki-lvs-prod-s3
            key: AWS_SECRET_ACCESS_KEY
    persistence:
      size: 5Gi
      storageClass: block-pure-c50-101-az-a
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # ============================================================
  # GATEWAY — nginx reverse proxy, HPA enabled
  # ============================================================
  gateway:
    enabled: true
    replicas: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300   # wait 5 min of sustained low usage before scaling down
          policies:
           - type: Pods
             value: 1
             periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 60
          policies:
           - type: Pods
             value: 2
             periodSeconds: 60
    service:
      type: LoadBalancer
      port: 3100
      targetPort: 8080
      annotations:
        loadbalancer.openstack.org/algorithm: ROUND_ROBIN
        loadbalancer.openstack.org/healthcheck-timeout: "5"
        loadbalancer.openstack.org/healthcheck-interval: "15"
        loadbalancer.openstack.org/keepalive-timeout: "60"
        loadbalancer.openstack.org/network-id: "a0759b3c-7d4a-4c19-a4e4-42b202d1f821"
        loadbalancer.openstack.org/subnet-id: "dec2cea2-89d2-4887-aede-2f71438a4430"
        loadbalancer.openstack.org/floating-network-id: "060a8516-9b81-42b9-a60a-5118da19eee5"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

  singleBinary:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

  

  monitoring:
    lokiCanary:
      enabled: true
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack
    selfMonitoring:
      enabled: false
                    # enable once stable — valuable e2e SLI

