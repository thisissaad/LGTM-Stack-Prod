apiVersion: v1
kind: Service
metadata:
  name: prometheus-thanos-sidecar
  namespace: lgtm-lvs-prod
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: lgtm-prod-lvs-prometheus
    app.kubernetes.io/component: server
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: lgtm-prod-lvs-prometheus
    app.kubernetes.io/component: server
  ports:
    - name: grpc
      port: 10901
      targetPort: 10901
      protocol: TCP
    - name: http
      port: 10902
      targetPort: 10902
      protocol: TCP