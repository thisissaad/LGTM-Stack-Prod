apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: paas-observability

  source:
    repoURL: https://gitlabmaster-03.bo3.e-dialog.com/zks/cockpit/argocd/lgtm.git
    targetRevision: master
    path: prometheus
    helm:
      skipCrds: true
      valueFiles:
        - values.yaml
      parameters:
        - name: namespaceOverride
          value: lgtm-lvs-prod

  destination:
    server: https://10.118.174.129:6443
    namespace: lgtm-lvs-prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true