    ####################################
    # Users — FIX #4
    ####################################
    ####################################
    # Server
    ####################################
    ##commenting out to stop redirect
    # server:
    #   root_url: "https://lgtm-paas-lvs-prod-grafana.las.onezeta.global"
    #   domain: "lgtm-paas-lvs-prod-grafana.las.onezeta.global"
    #   cors_allow_origins: "http://bm15-01-l2tools.bo3.e-dialog.com:8888"
    #   serve_from_sub_path: false #cors bypass

    security:
      cookie_secure: false
      cookie_samesite: lax
      disable_gravatar: false
      strict_transport_security: false
      secret_key: "$__env{GF_SECURITY_SECRET_KEY}"

    users:
      auto_assign_org: true
      auto_assign_org_id: 1
      auto_assign_org_role: Viewer   # NEVER Admin — do not auto-grant admin to all SSO users
      viewers_can_edit: false

    ####################################
    # Database — Postgres
    ####################################
    
    database:
      type: postgres
      host: "lgtm-obs-prd-pgdb1-vip.bo3.onezeta.global:5000"
      name: lgtm_prd_grafana
      user: "$__env{GF_DATABASE_USER}"
      password: "$__env{GF_DATABASE_PASSWORD}"
      ssl_mode: disable

    smtp:
      enabled: true
      host: mail-relay.e-dialog.com:25
      skip_verify: false   # only set true if the relay has no valid cert and is fully trusted/internal
      from_address: sakula@zetaglobal.com
      from_name: Grafana

    unified_alerting:
      enabled: true
      ha_listen_address: "${POD_IP}:9094"
      ha_advertise_address: "${POD_IP}:9094"
      ha_peers: "lgtm-prod-lvs-grafana-headless:9094"   
      ha_peer_timeout: 15s
      ha_reconnect_timeout: 2m